<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Rock, Paper, Scissors</h1>
    
    <div class="mode-selector">
      <button onclick="setMode('computer')">Player vs Computer</button>
      <button  hidden onclick="setMode('player')">Player vs Player</button>
    </div>

    <div id="gameArea">
      <p id="instruction">Choose your move:</p>
        <div class="choices">
        <button onclick="playerMove('rock')" class="hand rock">✊ Rock</button>
        <button onclick="playerMove('paper')" class="hand paper">✋ Paper</button>
        <button onclick="playerMove('scissors')" class="hand scissors">✌️ Scissors</button>
        </div>

     <p id="resultText"></p>
<button onclick="resetGame()" id="resetBtn">🔄 Reset</button>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
